# SpecTf architecture with Query2Label-style pooling
# (see spectf.model.SpecTfLabelQueryEncoder).
# One learned query vector per class, cross-attended into the encoder's
# token sequence, with an independent per-class head weight. Queries do not
# attend to each other (use_self_attn: false) -- label co-occurrence is left
# entirely to the loss. See model_config_ctran.yaml for the C-Tran variant.
#
# dim_output is set from the number of classes at runtime; the value here is
# a default/documentation only.
model:
  type: "label_query"
  dim_output: 5
  num_heads: 32
  dim_proj: 128
  dim_ff: 512
  dropout: 0.05
  use_residual: false
  num_layers: 2
  num_pool_layers: 1
  use_self_attn: false
