[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "specmix"
version = "0.1.0"
description = "Spectral mixing simulator for EMIT fractional cover unmixing"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Jake Lee" }]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "h5py",
    "pyyaml",
    "pandas",
    "kmedoids",
]

[project.optional-dependencies]
# The Dataset imports torch lazily; install this extra to use it as a DataLoader source.
torch = ["torch"]
# Plotting for the eval / experiment scripts.
viz = ["matplotlib"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the default config and bundled data (mixture prior + noise covariance)
# so the installed package is self-sufficient. Endmember HDF5s are NOT bundled.
specmix = ["sim_config.yaml", "data/*.csv"]
